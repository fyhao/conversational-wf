# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI and security scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: wf-converse/package-lock.json
    - name: Install dependencies
      run: cd wf-converse && npm ci --ignore-scripts
    - name: Run workflow engine, controller, and admin UI tests
      run: npm test
    - name: Fail on high production dependency vulnerabilities
      run: npm run security
